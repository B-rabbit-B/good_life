services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: goodlife
      POSTGRES_PASSWORD: goodlife
      POSTGRES_DB: goodlife
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - goodlife-pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodlife"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  goodlife-pgdata:

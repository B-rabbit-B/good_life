<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F7FAFE" />
    <title>good-life</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/gl-serif-700.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/gl-num-500.woff2" />
    <!-- 启动外壳：脚本接管前先画出对话页的页头文字与底座轮廓（实色材质），接管后的下一帧由 AppShell 移除 -->
    <style>
      html{background:#F7FAFE}
      #boot-shell .boot-top{position:fixed;top:0;right:0;left:0;z-index:6;padding-top:env(safe-area-inset-top)}
      #boot-shell .boot-hdr{display:flex;align-items:center;min-height:52px;padding:0 8px 0 20px}
      #boot-shell .boot-slab{position:fixed;right:8px;bottom:max(calc(env(safe-area-inset-bottom) - 16px), 18px);left:8px;z-index:8;height:158px;border-radius:28px;background:#EAF1FA;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.4),0 0 0 1px rgba(14,27,51,.08),0 12px 30px -16px rgba(14,27,51,.38)}
    </style>
  </head>
  <body>
    <div id="boot-shell" aria-hidden="true">
      <div class="field"></div>
      <div class="boot-top"><div class="boot-hdr"><span class="t-title">对话</span></div></div>
      <div class="boot-slab"></div>
    </div>
    <script>
      // 只有已登录且打开的是 / 或 /chat 时首屏才是对话页；其他情况去掉启动外壳
      (function () {
        var path = location.pathname, token = null
        try { token = localStorage.getItem('goodlife.token') } catch (e) {}
        if (!token || (path !== '/' && path !== '/chat')) {
          var boot = document.getElementById('boot-shell')
          if (boot) boot.parentNode.removeChild(boot)
        }
      })()
    </script>
    <div id="root"></div><div id="shell-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
